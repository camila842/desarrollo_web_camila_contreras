<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Detalle actividad</title>

        <link rel="stylesheet" th:href="@{/css/stylesheet.css}" />
    </head>

    <body>
        <div th:replace="~{fragments/nav :: navbar}"></div>

        <div class="container">
            <h1>Detalle de actividad</h1>

            <div class="activity-detail">
                <p>
                    <strong>Nombre:</strong>
                    <span th:text="${actividad.nombre}"></span>
                </p>

                <p>
                    <strong>Tipo:</strong>
                    <span th:text="${actividad.tipo}"></span>
                </p>

                <p>
                    <strong>Día:</strong>
                    <span th:text="${actividad.dia}"></span>
                </p>

                <p>
                    <strong>Hora inicio:</strong>
                    <span th:text="${actividad.horaInicio}"></span>
                </p>

                <p>
                    <strong>Duración:</strong>
                    <span th:text="${actividad.duracion}"></span>
                </p>

                <p>
                    <strong>Descripción:</strong>
                    <span th:text="${actividad.descripcion != null ? actividad.descripcion : ''}"></span>
                </p>

                <p>
                    <strong>Miembro:</strong>
                    <span th:text="${actividad.miembro != null ? actividad.miembro.nombre : '-'}"></span>
                </p>

                <p>
                    <strong>Comuna:</strong>
                    <span th:text="${actividad.miembro != null and actividad.miembro.comuna != null ? actividad.miembro.comuna.nombre : '-'}"></span>
                </p>

                <p>
                    <strong>Nota promedio:</strong>
                    <span id="nota-promedio" th:text="${promedioTexto}"></span>
                    <span
                        id="nota-cantidad"
                        style="color: #666; font-size: 0.9em;"
                        th:text="|${cantidadNotas} evaluaciones|"
                    ></span>
                </p>
            </div>

            <h2>Evaluación</h2>

            <div id="evaluacion-seccion">

                <div th:if="${puedeEvaluar}">
                    <form
                        id="evaluacion-form"
                        th:attr="data-actividad-id=${actividad.id}"
                        onsubmit="return false;"
                    >
                        <p><strong>Selecciona una nota:</strong></p>

                        <div class="nota-opciones">
                            <label><input type="radio" name="nota" value="1" /> 1</label>
                            <label><input type="radio" name="nota" value="2" /> 2</label>
                            <label><input type="radio" name="nota" value="3" /> 3</label>
                            <label><input type="radio" name="nota" value="4" /> 4</label>
                            <label><input type="radio" name="nota" value="5" /> 5</label>
                            <label><input type="radio" name="nota" value="6" /> 6</label>
                            <label><input type="radio" name="nota" value="7" /> 7</label>
                        </div>

                        <span class="error" id="error-evaluacion"></span>

                        <button type="submit" class="link-button">
                            Confirmar evaluación
                        </button>
                    </form>
                </div>

                <p th:if="${yaEvaluo}" class="ya-evaluo">
                    Ya evaluaste esta actividad.
                </p>

                <p th:if="${!usuarioLogueado}">
                    <a th:href="@{/login}">Inicia sesión</a> para evaluar esta actividad.
                </p>

            </div>

            <h2>Agregar comentario</h2>

            <div id="comentario-errores"></div>

            <form
                id="comentario-form"
                th:attr="data-actividad-id=${actividad.id}"
            >
                <div>
                    <label for="nombre">Nombre comentarista</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                    />
                    <span class="error" id="error-nombre-comentario"></span>
                </div>

                <div>
                    <label for="texto">Comentario</label>
                    <textarea
                        id="texto"
                        name="texto"
                        rows="4"
                        cols="50"
                    ></textarea>
                    <span class="error" id="error-texto-comentario"></span>
                </div>

                <button type="submit">Agregar comentario</button>
            </form>

            <a
                class="link-button"
                th:href="@{/members/{id}(id=${actividad.miembro.id})}"
            >
                Volver
            </a>

            <h2>Comentarios</h2>

            <div id="comentarios-listado">
                <p>Cargando comentarios...</p>
            </div>
        </div>

        <script th:src="@{/js/detalle_actividad.js}"></script>
    </body>
</html>
