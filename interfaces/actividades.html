<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title> Registro Actividades </title>
        <link rel="stylesheet" href="../css/stylesheet.css">
    </head>
    <body>
        <div class="encabezado">
            <div class="left-side"></div>
            <div class="right-side">
                <a href="../interfaces/registro.html">
                    <button class="section-linker" value="registro">Registro</button>
                </a>
                <a href="../interfaces/actividades.html">
                    <button class="section-linker" value="actividades">Actividades</button>
                </a>
                <a href="../interfaces/Miembros.html">
                    <button class="section-linker" value="miembros">Miembros</button>
                </a>
                <a href="../interfaces/metricas.html">
                    <button class="section-linker" value="metricas">Métricas</button>
                </a>
            </div>
        </div>
        <div class="container" id="form-container">
            <button type="button" id="add-activity">
                Añadir Actividad
            </button>
            <form class="activities-register" id="activities-register">
                <div class="activity-container" id="act-1">
                    <div class="name-input">
                        <label> Nombre actividad </label>
                        <input id="activity-name" name="activyty-name" type="text" required>
                    </div>
                    <div class="day-selector" >
                        <legend> Días de la actividad </legend>
                        <div class="day" id="monday-div">
                            <input type="checkbox" id="day-monday" name="week-day" value="monday">
                            <label for="day-monday"> Lunes </label>
                            <div class="time-selector">
                                <label> Desde: </label>
                                <input type="time" id="from-time" required>

                                <label> Hasta: </label>
                                <input type="time" id="until-time" required>
                            </div>
                        </div>
                        <div class="day" id="tuesday-div">
                            <input type="checkbox" id="day-tuesday" name="week-day" value="tuesday">
                            <label for="day-tuesday"> Martes </label>
                        </div>
                        <div class="day" id="wednesday-div">
                            <input type="checkbox" id="day-wednesday" name="week-day" value="wednesday">
                            <label for="day-wednesday"> Miércoles </label>
                        </div>
                        <div class="day" id="thursday-div">
                            <input type="checkbox" id="day-thursday" name="week-day" value="thursday">
                            <label for="day-thursday"> Jueves </label>
                        </div>
                        <div class="day" id="friday-div">
                            <input type="checkbox" id="day-friday" name="week-day" value="friday">
                            <label for="day-friday"> Viernes </label>
                        </div>
                        <div class="day" id="saturday-div">
                            <input type="checkbox" id="day-saturday" name="week-day" value="saturday">
                            <label for="day-saturday"> Sábado </label>
                        </div>
                        <div class="day" id="sunday-div">
                            <input type="checkbox" id="day-sunday" name="week-day" value="sunday">
                            <label for="day-sunday"> Domingo </label>
                        </div>
                    </div>
                    <div class="type-selector">
                        <label>Tipo de Actividad</label>
                        <select id="tipo-de-actividad">
                            <option value="">-- Seleccione --</option>
                            <option value="deportiva">Deportiva</option>
                            <option value="artistica">Artística</option>
                            <option value="tecnologica">Tecnológica</option>
                            <option value="social">Social</option>
                            <option value="recreativa">Recreativa</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <script lang="javascript" src="../js/actividades.js"></script>
    </body>
</html>
