<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title> Registro </title>
        <link rel="stylesheet" href="../css/stylesheet.css">
    </head>
    <body>
        <div class="encabezado">
            <div class="left-side">
                <h3>Extra-Curricular DCC</h3>
            </div>
            <div class="right-side">
                <a href="../interfaces/registro.html">
                    <button class="section-linker" value="registro">Registro</button>
                </a>
                <a href="../interfaces/actividades.html">
                    <button class="section-linker" value="actividades">Actividades</button>
                </a>
                <a href="../interfaces/Miembros.html">
                    <button class="section-linker" value="miembros">Miembros</button>
                </a>
                <a href="../interfaces/metricas.html">
                    <button class="section-linker" value="metricas">Métricas</button>
                </a>
            </div>
        </div>
        <div class="container">
            <form class="formulario" id="sign-up-form">
                <div class="sign-up-input" id="name-input">
                    <label> Nombre </label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div class="sign-up-input" id="surname-input">
                    <label> Apellido </label>
                    <input id="surname" name="surname" type="text" required>
                </div>
                <div class="sign-up-input" id="email-input">
                    <label> Correo Electrónico </label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="sign-up-input" id="password-input">
                    <label> Contraseña </label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="button" id="register-button">
                    <button type="submit" id="forms-submit">
                        Registrarse
                    </button>
                </div>
            </form>
        </div>
    </body>
</html>
