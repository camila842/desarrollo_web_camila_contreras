<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> Miembros </title>
        <link rel="stylesheet" href="../css/stylesheet.css">
    </head>
    <body>
        <div class="encabezado">
            <div class="left-side"></div>
            <div class="right-side">
                <a href="../interfaces/registro.html">
                    <button class="section-linker" value="registro">Registro</button>
                </a>
                <a href="../interfaces/actividades.html">
                    <button class="section-linker" value="actividades">Actividades</button>
                </a>
                <a href="../interfaces/Miembros.html">
                    <button class="section-linker" value="miembros">Miembros</button>
                </a>
                <a href="../interfaces/metricas.html">
                    <button class="section-linker" value="metricas">Métricas</button>
                </a>
            </div>
        </div>
        <div class="container">
            <h1> Consulta de miembros</h1>
            <form id="filters-form">
                <div class="query-filters">
                    <span>Filtrar por: </span>
                    <label>Tipo</label>
                    <select class="tipo-de-actividad">
                        <option value="">-- Seleccione --</option>
                        <option value="Deportiva">Deportiva</option>
                        <option value="Artística">Artística</option>
                        <option value="Tecnológica">Tecnológica</option>
                        <option value="Social">Social</option>
                        <option value="Recreativa">Recreativa</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="query-order">
                    <span>Ordenar por:</span>
                    <select class="atributo-de-ordenamiento">
                        <option value="">-- Atributo --</option>
                        <option value="nombre">Nombre</option>
                        <option value="email">email</option>
                    </select>
                    <select class="tipo-de-ordenamiento">
                        <option value="">-- Ordenamiento --</option>
                        <option value=">">Mayor a menor</option>
                        <option value="<">Menor a mayor</option>
                    </select>
                </div>
                <button type="submit" class="button visible">
                    Buscar
                </button>
            </form>
            <div class="table-container">
                <table id="members-query">
                    <tr class="table-head">
                        <th> Nombre </th>
                        <th> Email </th>
                        <th> Actividad </th>
                        <th> Tipo </th>
                    </tr>
                </table>
            </div>
        </div>
        <script lang="javascript" src="../js/miembros.js"></script>
    </body>
</html>
